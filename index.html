<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Expense & Budget Visualizer - Track expenses, manage budgets, and visualize spending patterns">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <h1>Expense & Budget Visualizer</h1>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle theme">
                <span class="theme-icon">🌙</span>
            </button>
        </header>

        <!-- Total Balance Display -->
        <section class="balance-section">
            <h2>Total Balance</h2>
            <div id="totalBalance" class="balance-amount">$0.00</div>
        </section>

        <!-- Error/Notification Banner -->
        <div id="errorBanner" class="error-banner" role="alert" aria-live="polite"></div>
        <div id="notificationBanner" class="notification-banner" role="status" aria-live="polite"></div>

        <!-- Main Content Area -->
        <main class="main-content">
            <!-- Transaction Input Form -->
            <section class="transaction-form-section">
                <h2>Add Transaction</h2>
                <form id="transactionForm" class="transaction-form" aria-label="Add transaction">
                    <div class="form-group">
                        <label for="itemName">Item Name</label>
                        <input 
                            type="text" 
                            id="itemName" 
                            name="itemName"
                            maxlength="100"
                            aria-required="true"
                            aria-describedby="itemNameError"
                            placeholder="e.g., Lunch, Gas, Movie tickets"
                        >
                        <span id="itemNameError" class="error-message" role="alert"></span>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input 
                            type="number" 
                            id="amount" 
                            name="amount"
                            step="0.01"
                            aria-required="true"
                            aria-describedby="amountError"
                            placeholder="e.g., 25.50"
                        >
                        <span id="amountError" class="error-message" role="alert"></span>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select 
                            id="category" 
                            name="category"
                            aria-required="true"
                            aria-describedby="categoryError"
                        >
                            <option value="">-- Select Category --</option>
                        </select>
                        <span id="categoryError" class="error-message" role="alert"></span>
                    </div>

                    <button type="submit" class="btn btn-primary">Add Transaction</button>
                </form>
            </section>

            <!-- Category Management Section -->
            <section class="category-management-section">
                <h2>Manage Categories</h2>
                <div class="category-form">
                    <input 
                        type="text" 
                        id="newCategoryName" 
                        placeholder="New category name"
                        maxlength="30"
                        aria-label="New category name"
                        aria-describedby="categoryManagementError"
                    >
                    <button id="addCategoryBtn" class="btn btn-secondary">Add Category</button>
                </div>
                <span id="categoryManagementError" class="error-message" role="alert"></span>
                <div id="categoryList" class="category-list"></div>
            </section>

            <!-- Budget Management Section -->
            <section class="budget-management-section">
                <h2>Budget Limits</h2>
                <div id="budgetList" class="budget-list"></div>
            </section>

            <!-- Transactions List -->
            <section class="transactions-section">
                <h2>Transaction History</h2>
                <div id="transactionsList" class="transactions-list"></div>
            </section>

            <!-- Spending Visualization -->
            <section class="chart-section">
                <h2>Spending by Category</h2>
                <div class="chart-container">
                    <canvas id="spendingChart" aria-label="Spending distribution pie chart"></canvas>
                    <div id="chartEmpty" class="chart-empty-message">No spending data to display</div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>&copy; 2024 Expense & Budget Visualizer</p>
        </footer>
    </div>

    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Application JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
