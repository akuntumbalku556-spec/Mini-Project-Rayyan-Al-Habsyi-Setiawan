<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Expense & Budget Visualizer - Track expenses, manage budgets, and visualize spending patterns">
    <title>Expense & Budget Visualizer</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <!-- Skip link for keyboard navigation -->
    <a href="#main-content" class="skip-link">Skip to main content</a>
    
    <div class="app-container">
        <!-- Header Section -->
        <header class="app-header">
            <h1>Expense & Budget Visualizer</h1>
            <button id="themeToggle" class="theme-toggle" aria-label="Toggle between light and dark theme">
                <span class="theme-icon">🌙</span>
            </button>
        </header>

        <!-- Total Balance Display -->
        <section class="balance-section">
            <h2>Total Balance</h2>
            <div id="totalBalance" class="balance-amount">$0.00</div>
        </section>

        <!-- Error/Notification Banner -->
        <div id="errorBanner" class="error-banner" role="alert" aria-live="polite"></div>
        <div id="notificationBanner" class="notification-banner" role="status" aria-live="polite"></div>

        <!-- Global Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay" role="status" aria-live="polite" aria-label="Loading">
            <div class="loading-spinner"></div>
        </div>

        <!-- Main Content Area -->
        <main id="main-content" class="main-content" role="main">
            <!-- Transaction Input Form -->
            <section class="transaction-form-section" aria-labelledby="add-transaction-heading">
                <h2 id="add-transaction-heading">Add Transaction</h2>
                <form id="transactionForm" class="transaction-form" aria-label="Add transaction" novalidate>
                    <div class="form-group">
                        <label for="itemName">Item Name</label>
                        <input 
                            type="text" 
                            id="itemName" 
                            name="itemName"
                            maxlength="100"
                            aria-required="true"
                            aria-describedby="itemNameError"
                            aria-invalid="false"
                            placeholder="e.g., Lunch, Gas, Movie tickets"
                        >
                        <span id="itemNameError" class="error-message" role="alert" aria-live="polite"></span>
                    </div>

                    <div class="form-group">
                        <label for="amount">Amount</label>
                        <input 
                            type="number" 
                            id="amount" 
                            name="amount"
                            step="0.01"
                            aria-required="true"
                            aria-describedby="amountError"
                            aria-invalid="false"
                            placeholder="e.g., 25.50"
                        >
                        <span id="amountError" class="error-message" role="alert" aria-live="polite"></span>
                    </div>

                    <div class="form-group">
                        <label for="category">Category</label>
                        <select 
                            id="category" 
                            name="category"
                            aria-required="true"
                            aria-describedby="categoryError"
                            aria-invalid="false"
                        >
                            <option value="">-- Select Category --</option>
                        </select>
                        <span id="categoryError" class="error-message" role="alert" aria-live="polite"></span>
                    </div>

                    <button type="submit" class="btn btn-primary" aria-describedby="add-transaction-heading">
                        Add Transaction
                    </button>
                </form>
            </section>

            <!-- Category Management Section -->
            <section class="category-management-section" aria-labelledby="category-management-heading">
                <h2 id="category-management-heading">Manage Categories</h2>
                <form class="category-form" aria-label="Add new category" novalidate>
                    <input 
                        type="text" 
                        id="newCategoryName" 
                        placeholder="New category name"
                        maxlength="30"
                        aria-label="New category name"
                        aria-describedby="categoryManagementError"
                        aria-invalid="false"
                    >
                    <button type="submit" id="addCategoryBtn" class="btn btn-secondary" aria-describedby="category-management-heading">
                        Add Category
                    </button>
                </form>
                <span id="categoryManagementError" class="error-message" role="alert" aria-live="polite"></span>
                <div id="categoryList" class="category-list" role="list" aria-label="Current categories"></div>
            </section>

            <!-- Budget Management Section -->
            <section class="budget-management-section" aria-labelledby="budget-management-heading">
                <h2 id="budget-management-heading">Budget Limits</h2>
                <div id="budgetList" class="budget-list" role="list" aria-label="Budget limits"></div>
            </section>

            <!-- Transactions List -->
            <section class="transactions-section" aria-labelledby="transactions-heading">
                <h2 id="transactions-heading">Transaction History</h2>
                <div id="transactionsList" class="transactions-list" role="list" aria-label="Transaction history" tabindex="0"></div>
            </section>

            <!-- Spending Visualization -->
            <section class="chart-section" aria-labelledby="chart-heading">
                <h2 id="chart-heading">Spending by Category</h2>
                <div class="chart-container">
                    <canvas id="spendingChart" aria-label="Spending distribution pie chart" role="img"></canvas>
                    <div id="chartEmpty" class="chart-empty-message">No spending data to display</div>
                </div>
            </section>
        </main>

        <!-- Footer -->
        <footer class="app-footer">
            <p>&copy; 2024 Expense & Budget Visualizer</p>
        </footer>
    </div>

    <!-- Chart.js Library -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    
    <!-- Application JavaScript -->
    <script src="js/app.js"></script>
</body>
</html>
